[project]
name = "mneme-backend"
version = "0.1.0"
description = "FastAPI backend for the Mneme research assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "anthropic>=0.75,<1",
    "arq>=0.27,<1",
    "asyncpg>=0.30,<1",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "gunicorn>=26,<27",
    "httpx>=0.28,<1",
    "openai>=1.60,<3",
    "pdfplumber>=0.11,<1",
    "pgvector>=0.4,<1",
    "pydantic-settings>=2.7,<3",
    "pymupdf>=1.25,<2",
    "redis>=5.2,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<27",
    "uvicorn[standard]>=0.32,<1",
    "uvicorn-worker>=0.4,<1",
]

[project.optional-dependencies]
local-embeddings = ["fastembed>=0.7,<1"]

[dependency-groups]
dev = [
    "pyrefly>=0.30,<1",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.11,<1",
    "types-defusedxml>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mneme"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "base: fast tests required for every backend change",
    "api: FastAPI endpoint and contract tests",
    "rag: retrieval and generation tests",
    "pipeline: ingestion and document-processing tests",
    "db: database model and migration tests",
]

[tool.coverage.run]
branch = true
source = ["mneme"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mneme"]
known-third-party = ["alembic"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "tests"]
