<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <rect width="1600" height="780" rx="28" fill="#F7F9FB"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="82" font-size="38" font-weight="700" fill="#17324D">Recurring needs in the interview sample</text>
    <text x="90" y="126" font-size="23" fill="#5C6875">Number of participants whose records contained each finding (n = 10)</text>

    <g stroke="#D9E0E7" stroke-width="2">
      <line x1="690" y1="176" x2="690" y2="658"/>
      <line x1="848" y1="176" x2="848" y2="658"/>
      <line x1="1006" y1="176" x2="1006" y2="658"/>
      <line x1="1164" y1="176" x2="1164" y2="658"/>
      <line x1="1322" y1="176" x2="1322" y2="658"/>
      <line x1="1480" y1="176" x2="1480" y2="658"/>
    </g>

    <g font-size="20" fill="#6E7883" text-anchor="middle">
      <text x="690" y="704">0</text>
      <text x="848" y="704">2</text>
      <text x="1006" y="704">4</text>
      <text x="1164" y="704">6</text>
      <text x="1322" y="704">8</text>
      <text x="1480" y="704">10</text>
    </g>

    <g font-size="29" fill="#252A31">
      <text x="90" y="248">Recover a previously read paper</text>
      <text x="90" y="368">Keep pace with paper volume</text>
      <text x="90" y="488">Maintain links among papers and ideas</text>
      <text x="90" y="608">Keep personal storage organised</text>
    </g>

    <rect x="690" y="210" width="632" height="56" rx="14" fill="#2F6F8F"/>
    <rect x="690" y="330" width="553" height="56" rx="14" fill="#2D8C87"/>
    <rect x="690" y="450" width="553" height="56" rx="14" fill="#C89445"/>
    <rect x="690" y="570" width="237" height="56" rx="14" fill="#7A8794"/>

    <g font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="1322" cy="238" r="31" fill="#17324D"/>
      <text x="1322" y="248">8</text>
      <circle cx="1243" cy="358" r="31" fill="#17324D"/>
      <text x="1243" y="368">7</text>
      <circle cx="1243" cy="478" r="31" fill="#17324D"/>
      <text x="1243" y="488">7</text>
      <circle cx="927" cy="598" r="31" fill="#17324D"/>
      <text x="927" y="608">3</text>
    </g>

    <text x="90" y="744" font-size="20" fill="#6E7883">Counts overlap because one participant could contribute to several findings.</text>
  </g>
</svg>
