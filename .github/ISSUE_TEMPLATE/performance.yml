name: Performance Improvement
description: Optimize a specific part of the system
title: "[PERF] "
labels: ["type/performance"]
body:
    - type: markdown
      attributes:
          value: |
              ***NOTES: For developers assigned, all code related to the performance improvement should be explain in detail here, recording the whole process of achieving the acceptance criteria and how much performance is improved. Then, link this issue to the corresponding pull request.***

    - type: textarea
      id: summary
      attributes:
          label: Low-performance Summary
          description: A clear and short summary of what the low-performance issue is.
      validations:
          required: true

    - type: textarea
      id: current
      attributes:
          label: Current Performance
          description: How the system is currently performing, including any relevant metrics or benchmarks.
          placeholder: |
              - Take x seconds to complete y test

    - type: textarea
      id: acceptance-criteria
      attributes:
          label: Acceptance Criteria
          description: The criteria that must be met for the performance improvement to be considered complete.
          placeholder: |
              1. **WHEN** [test]

                  **THEN** [improvement]

              2. **WHEN** [test]

                  **THEN** [improvement]
      validations:
          required: true

    - type: dropdown
      id: area
      attributes:
          label: Related Area
          description: Select the area of the codebase where the bug was found.
          options:
              - Android/UI
              - Android/Network
              - Android/Database
              - Android/Other
              - Backend/API
              - Backend/Database
              - Backend/RAG
              - Backend/Pipeline
              - Backend/Other
              - Other
      validations:
          required: true

    - type: input
      id: time-estimate
      attributes:
          label: Rough time Estimate
          description: Rough time estimate to develop the feature.
          placeholder: |
              x hours
      validations:
          required: true

    - type: textarea
      id: verification
      attributes:
          label: Verification
          description: Check all acceptance criteria here.
          placeholder: |
              - [ ] Acceptance Criteria 1
              - [ ] Acceptance Criteria 2
              - [ ] Acceptance Criteria 3
      validations:
          required: true

    - type: checkboxes
      id: checklist
      attributes:
          label: Checklist
          description: Please check following before submitting this issue.
          options:
              - label: I have checked the contributing guidelines carefully.
                required: true
              - label: I have set the assignees, labels, and milestones and going to set relationships and development for this issue.
                required: true

    - type: textarea
      id: additional-context
      attributes:
          label: Additional Context
          description: Add any other context about the problem here.
